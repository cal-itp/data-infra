operator: operators.ExternalTable
bucket: "{{ env_var('CALITP_BUCKET__LITTLEPAY_PARSED_V3') }}"
source_objects:
  - "revenue-inspection-outcomes/*.jsonl.gz"
destination_project_dataset_table: "external_littlepay_v3.revenue_inspection_outcomes"
source_format: NEWLINE_DELIMITED_JSON
use_bq_client: true
hive_options:
  mode: CUSTOM
  require_partition_filter: false
  source_uri_prefix: "revenue-inspection-outcomes/{instance:STRING}/{extract_filename:STRING}/{ts:TIMESTAMP}/"
schema_fields:
  - name: participant_id
    type: STRING
  - name: session_id
    type: STRING
  - name: inspection_time_utc
    type: TIMESTAMP
  - name: inspection_time_local
    type: STRING  # includes UTC offset of the inspection device
  - name: device_id
    type: STRING
  - name: app_version
    type: STRING
  - name: inspector_login_email
    type: STRING
  - name: outcome
    type: STRING  # BLOCKED, CARD_NOT_FOUND, TAP_NOT_FOUND, VALID_TAP
  - name: vault_id  # same value as funding_source_id in other feeds
    type: STRING
  - name: customer_id
    type: STRING
  - name: card_scheme
    type: STRING
  - name: masked_pan
    type: STRING
  - name: issuer_country
    type: STRING  # ISO 3166-1 numeric, keep as STRING to preserve leading zeros
  - name: form_factor
    type: STRING
  - name: bin
    type: STRING
  - name: location_latitude
    type: STRING
  - name: location_longitude
    type: STRING
  - name: _line_number
    type: STRING
