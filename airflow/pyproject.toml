[project]
name = "data-infra-airflow"
version = "0.1.0"
description = "Airflow DAGs and plugins for cal-itp-data-infra"
readme = "README.md"
requires-python = ">=3.11.6,<3.12"
dependencies = [
    "apache-airflow",
    "apache-airflow-providers-amazon",
    "apache-airflow-providers-cncf-kubernetes",
    "apache-airflow-providers-google",
    "astronomer-cosmos",
    "backoff",
    "beautifulsoup4",
    "boto3",
    "ckanapi",
    "google-cloud-storage",
    "gtfs-realtime-bindings",
    "gusty",
    "humanize",
    "openpyxl",
    "pyairtable",
    "typer",
]

[dependency-groups]
dev = [
    "freezegun",
    "ipdb",
    "moto[s3]",
    "pytest",
    "pytest-dotenv",
    "pytest-recording",
    "vcrpy",
]

[tool.uv]
