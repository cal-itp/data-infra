name: Deploy dbt

# - push to main: production (dbt runs, docs, Metabase, Airflow upload)
# - push to staging/official: staging, the same steps
# - pull requests: compile, Airflow plans and advisory CI checks; nothing is
#   written to shared staging
# See docs/architecture/staging-deployment.md.
#
# Pushes have no `paths` filter: rebuild-staging force-pushes staging/official,
# so the changed files are computed from the push's before/after commits.

on:
  push:
    branches:
      - main
      - staging/official
  pull_request:
    paths:
      - .github/workflows/deploy-dbt.yml
      - .github/scripts/dbt_ci_report.py
      - 'warehouse/**'

# PRs cancel their own superseded runs. Deploys never cancel or replace each
# other: each push's run deploys only that push's changed models.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.11'
  SERVICE_ACCOUNT: ${{ github.ref == 'refs/heads/main' && 'github-actions-service-account@cal-itp-data-infra.iam.gserviceaccount.com' || 'github-actions-service-account@cal-itp-data-infra-staging.iam.gserviceaccount.com' }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ github.ref == 'refs/heads/main' && 'projects/1005246706141/locations/global/workloadIdentityPools/github-actions/providers/data-infra' || 'projects/473674835135/locations/global/workloadIdentityPools/github-actions/providers/data-infra' }}
  PROJECT_ID: ${{ github.ref == 'refs/heads/main' && 'cal-itp-data-infra' || 'cal-itp-data-infra-staging' }}
  DBT_TARGET: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
  DBT_DOCS_BUCKET: ${{ github.ref == 'refs/heads/main' && 'calitp-dbt-docs' || 'calitp-staging-dbt-docs' }}
  CALITP_BUCKET__PUBLISH: ${{ github.ref == 'refs/heads/main' && 'calitp-publish' || 'calitp-staging-publish' }}
  GOOGLE_CLOUD_PROJECT: ${{ github.ref == 'refs/heads/main' && 'cal-itp-data-infra' || 'cal-itp-data-infra-staging' }}
  METABASE_DESTINATION_DATABASE: ${{ github.ref == 'refs/heads/main' && 'Data Marts (formerly Warehouse Views)' || '(Internal) Staging Warehouse Views' }}
  METABASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://metabase.dds.dot.ca.gov' || 'https://metabase-staging.dds.dot.ca.gov' }}
  METABASE_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.METABASE_API_KEY || secrets.METABASE_STAGING_API_KEY }}
  DBT_DOCS_URL: ${{ github.ref == 'refs/heads/main' && 'https://dbt-docs.dds.dot.ca.gov' || 'https://dbt-docs-staging.dds.dot.ca.gov' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      dbt: ${{ steps.compute.outputs.dbt }}
      full: ${{ steps.changes.outputs.full }}
      has-changed: ${{ steps.compute.outputs.has-changed }}
      has-changed-seeds: ${{ steps.compute.outputs.has-changed-seeds }}
      changed-models: ${{ steps.compute.outputs.changed-models }}
      changed-seeds: ${{ steps.compute.outputs.changed-seeds }}
      changed-downstream: ${{ steps.compute.outputs.changed-downstream }}
      staging-airflow-tf: ${{ steps.compute.outputs.staging-airflow-tf }}
      production-airflow-tf: ${{ steps.compute.outputs.production-airflow-tf }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Changed files
        id: changes
        uses: ./.github/actions/changed-files
        with:
          since-ref: ${{ github.ref == 'refs/heads/staging/official' && 'refs/deployed/staging/deploy-dbt' || '' }}

      # Deleted models and seeds are skipped: a model a dropped staging test
      # added no longer exists, so there is nothing to run.
      - name: Compute changes
        id: compute
        env:
          FILES: ${{ steps.changes.outputs.files }}
        shell: python
        run: |
          import fnmatch, os

          files = [f for f in os.environ["FILES"].splitlines() if f]
          def present(prefix, pattern):
              return [
                  f[len("warehouse/"):]
                  for f in files
                  if f.startswith(prefix) and fnmatch.fnmatch(f, pattern) and os.path.exists(f)
              ]

          models = present("warehouse/models/", "*.sql")
          seeds = [s for s in present("warehouse/seeds/", "*.csv") if s.count("/") == 1]
          dbt = any(f.startswith("warehouse/") or f == ".github/workflows/deploy-dbt.yml" for f in files)
          changed = models + seeds
          outputs = {
              "dbt": str(dbt).lower(),
              "has-changed": str(bool(changed)).lower(),
              "has-changed-seeds": str(bool(seeds)).lower(),
              "changed-models": " ".join(models),
              "changed-seeds": " ".join(seeds),
              "changed-downstream": "+ ".join(changed) + "+" if changed else "",
              "staging-airflow-tf": str(any(
                  f.startswith("iac/cal-itp-data-infra-staging/airflow/") and f.endswith(".tf") for f in files
              )).lower(),
              "production-airflow-tf": str(any(
                  f.startswith("iac/cal-itp-data-infra/airflow/") and f.endswith(".tf") for f in files
              )).lower(),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key, value in outputs.items():
                  out.write(f"{key}={value}\n")
                  print(f"{key}={value}")

  compile:
    name: Compile dbt and upload artifacts
    runs-on: ubuntu-latest
    needs: [changes]

    if: ${{ needs.changes.outputs.dbt == 'true' || needs.changes.outputs.full == 'true' }}

    permissions:
      contents: read
      id-token: write

    steps:
      # On staging/official, use the branch tip: runs finish out of order, and
      # an older commit must never roll back a newer one.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref == 'refs/heads/staging/official' && 'staging/official' || github.sha }}
          fetch-depth: 0

      - name: Require main in staging/official
        if: ${{ github.ref == 'refs/heads/staging/official' }}
        run: python3 .github/scripts/staging_official.py require-main

      - name: Authenticate Google Service Account
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: 'true'
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Setup GCloud utilities
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          working-directory: warehouse
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-python: true

      - name: Cache venv and dbt packages
        uses: actions/cache@v4
        with:
          path: |
            warehouse/.venv
            warehouse/dbt_packages
          key: dbt-setup-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('warehouse/uv.lock', 'warehouse/packages.yml') }}

      - name: Install the project
        working-directory: warehouse
        run: uv sync --locked --all-extras --dev

      - name: Install dbt dependencies
        working-directory: warehouse
        run: uv run dbt deps

      - name: Print dbt environment
        working-directory: warehouse
        run: uv run dbt debug --target ${{ env.DBT_TARGET }}

      - name: Compile dbt
        working-directory: warehouse
        run: uv run dbt compile --target ${{ env.DBT_TARGET }}

      - name: Generate dbt documentation
        working-directory: warehouse
        run: uv run dbt docs generate --target ${{ env.DBT_TARGET }} --no-compile

      # Uploads only on deploys. PRs used to upload to the staging docs bucket,
      # which staging Airflow also reads its manifest from.
      # Don't send run_results.json because DBT_DOCS_BUCKET is a public bucket
      - name: Upload catalog.json and manifest.json
        if: ${{ github.event_name == 'push' }}
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: './warehouse/target/'
          glob: '{catalog.json,manifest.json}'
          parent: false
          process_gcloudignore: false
          destination: ${{ env.DBT_DOCS_BUCKET }}
          headers: |-
            content-type: application/json

      - name: Upload index.html
        if: ${{ github.event_name == 'push' }}
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: './warehouse/target/'
          glob: 'index.html'
          parent: false
          process_gcloudignore: false
          destination: ${{ env.DBT_DOCS_BUCKET }}
          headers: |-
            content-type: text/html; charset=utf-8

      - name: Upload partial_parse.msgpack
        if: ${{ github.event_name == 'push' }}
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: './warehouse/target/'
          glob: 'partial_parse.msgpack'
          parent: false
          process_gcloudignore: false
          destination: ${{ env.DBT_DOCS_BUCKET }}
          headers: |-
            content-type: application/vnd.msgpack

  dbt-run:
    name: Run dbt changed models in warehouse
    runs-on: ubuntu-latest
    needs: [changes]

    # Deploys only. A new branch (full=true) runs no models: it starts equal to main.
    if: ${{ github.event_name == 'push' && needs.changes.outputs.has-changed == 'true' }}

    permissions:
      contents: read
      id-token: write

    # Staging runs one at a time and are never cancelled; a replaced pending run
    # is safe because the next run diffs from the last recorded deploy.
    concurrency:
      group: ${{ github.ref == 'refs/heads/staging/official' && 'staging-dbt-run' || format('dbt-run-{0}', github.run_id) }}
      cancel-in-progress: false

    steps:
      # On staging/official, use the branch tip: runs finish out of order, and
      # an older commit must never roll back a newer one.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref == 'refs/heads/staging/official' && 'staging/official' || github.sha }}
          fetch-depth: 0

      - name: Require main in staging/official
        if: ${{ github.ref == 'refs/heads/staging/official' }}
        run: python3 .github/scripts/staging_official.py require-main

      - name: Authenticate Google Service Account
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: 'true'
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Setup GCloud utilities
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          working-directory: warehouse
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-python: true

      - name: Cache venv and dbt packages
        uses: actions/cache@v4
        with:
          path: |
            warehouse/.venv
            warehouse/dbt_packages
          key: dbt-setup-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('warehouse/uv.lock', 'warehouse/packages.yml') }}

      - name: Install the project
        working-directory: warehouse
        run: uv sync --locked --all-extras --dev

      - name: Install dbt dependencies
        working-directory: warehouse
        run: uv run dbt deps

      - name: List changed and downstream models
        working-directory: warehouse
        run: uv run dbt list --select "${{ needs.changes.outputs.changed-downstream }}" --target ${{ env.DBT_TARGET }} --resource-type=model

      - name: Run seeds
        if: ${{ needs.changes.outputs.has-changed-seeds == 'true' }}
        working-directory: warehouse
        run: uv run dbt seed --select "${{ needs.changes.outputs.changed-seeds }}" --target ${{ env.DBT_TARGET }}

      - name: Full-Refresh changed models
        if: ${{ needs.changes.outputs.changed-models != '' }}
        working-directory: warehouse
        run: uv run dbt run --select "${{ needs.changes.outputs.changed-models }}" --target ${{ env.DBT_TARGET }} --full-refresh

      - name: Run downstream models
        working-directory: warehouse
        run: uv run dbt run --select "${{ needs.changes.outputs.changed-downstream }}" --target ${{ env.DBT_TARGET }} --exclude "${{ needs.changes.outputs.changed-models }}"

  ci-checks:
    name: dbt CI checks (advisory)
    runs-on: ubuntu-latest
    needs: [changes]

    # PRs only, instead of running in shared staging. Advisory until its cost
    # and false-failure rate are known; see docs/architecture/staging-deployment.md.
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.has-changed == 'true' && github.actor != 'dependabot[bot]' }}
    continue-on-error: true

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    env:
      CI_SCHEMA: ci_pr_${{ github.event.number }}
      CI_PROFILES_DIR: ${{ github.workspace }}/../dbt-ci-profiles
      BASE_DIR: ${{ github.workspace }}/../dbt-ci-base
      BASE_TARGET: ${{ github.workspace }}/../dbt-ci-base-target

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authenticate Google Service Account
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: 'true'
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Setup GCloud utilities
        uses: google-github-actions/setup-gcloud@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          working-directory: warehouse
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-python: true

      - name: Cache venv and dbt packages
        uses: actions/cache@v4
        with:
          path: |
            warehouse/.venv
            warehouse/dbt_packages
          key: dbt-setup-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('warehouse/uv.lock', 'warehouse/packages.yml') }}

      - name: Install the project
        working-directory: warehouse
        run: uv sync --locked --all-extras --dev

      - name: Install dbt dependencies
        working-directory: warehouse
        run: uv run dbt deps

      # A `ci` target writing to ci_pr_<n>_* datasets in the staging project,
      # with a per-query spending cap. Generated here rather than added to
      # warehouse/profiles.yml, which Airflow deploys.
      - name: Write CI profile
        working-directory: warehouse
        run: |
          mkdir -p "$CI_PROFILES_DIR"
          uv run python - <<'EOF'
          import os, yaml
          with open("profiles.yml") as f:
              profiles = yaml.safe_load(f)
          outputs = profiles["calitp_warehouse"]["outputs"]
          staging = dict(outputs["staging"])
          ci = dict(staging, schema=os.environ["CI_SCHEMA"], maximum_bytes_billed=10_000_000_000)
          profile = {"calitp_warehouse": {"target": "ci", "outputs": {"ci": ci, "staging": staging}}}
          with open(os.path.join(os.environ["CI_PROFILES_DIR"], "profiles.yml"), "w") as f:
              yaml.safe_dump(profile, f)
          EOF

      # state:modified compares against the PR's base branch, parsed with the
      # staging target so deferred refs resolve to the staging datasets.
      - name: Parse the base branch
        working-directory: warehouse
        run: |
          git worktree add --detach "$BASE_DIR" "${{ github.event.pull_request.base.sha }}"
          uv run dbt deps --project-dir "$BASE_DIR/warehouse"
          uv run dbt parse --project-dir "$BASE_DIR/warehouse" --profiles-dir "$CI_PROFILES_DIR" \
            --target staging --target-path "$BASE_TARGET"

      - name: List changed models
        working-directory: warehouse
        run: |
          uv run dbt ls --profiles-dir "$CI_PROFILES_DIR" --target ci --state "$BASE_TARGET" \
            --select "state:modified,resource_type:model" --output name --quiet > "$RUNNER_TEMP/modified.txt" || true
          cat "$RUNNER_TEMP/modified.txt"

      # --favor-state resolves refs to the staging tables, so the dry run sees
      # real (staging) data volumes for unchanged upstream models.
      - name: Compile changed models for dry runs
        working-directory: warehouse
        run: |
          uv run dbt compile --profiles-dir "$CI_PROFILES_DIR" --target ci \
            --defer --favor-state --state "$BASE_TARGET" \
            --select "state:modified+,resource_type:model"
          mkdir -p "$RUNNER_TEMP/compile"
          cp target/manifest.json target/run_results.json "$RUNNER_TEMP/compile/"

      # Empty tables: checks SQL, columns and types across the changed chain.
      # Microbatch models are limited to one batch.
      - name: Build changed models with no data
        id: build
        continue-on-error: true
        working-directory: warehouse
        run: |
          uv run dbt build --profiles-dir "$CI_PROFILES_DIR" --target ci --empty \
            --defer --state "$BASE_TARGET" --select "state:modified+" \
            --event-time-start "$(date -u -d yesterday +%F)" --event-time-end "$(date -u +%F)"

      - name: Write report
        id: report
        if: ${{ always() }}
        working-directory: warehouse
        run: |
          uv run python ../.github/scripts/dbt_ci_report.py \
            --compile-dir "$RUNNER_TEMP/compile" \
            --build-results target/run_results.json \
            --build-outcome "${{ steps.build.outcome }}" \
            --modified "$RUNNER_TEMP/modified.txt" \
            --project "${{ env.PROJECT_ID }}" > "$RUNNER_TEMP/dbt-ci-report.md"
          cat "$RUNNER_TEMP/dbt-ci-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Find existing report comment
        if: ${{ always() && steps.report.outcome == 'success' }}
        id: find-report
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- dbt-ci-report -->'

      - name: Post or update report comment
        if: ${{ always() && steps.report.outcome == 'success' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-report.outputs.comment-id }}
          issue-number: ${{ github.event.number }}
          body-path: ${{ runner.temp }}/dbt-ci-report.md
          edit-mode: replace

      - name: Fail if the empty build failed
        if: ${{ steps.build.outcome == 'failure' }}
        run: exit 1

  metabase:
    name: Sync Metabase
    runs-on: ubuntu-latest
    needs: [changes, compile, dbt-run]

    # Runs on deploys only (main: production, staging/official: staging).
    # Skip Dependabot: its runs see a separate secrets namespace, so
    # METABASE_API_KEY expands to "" and the sync step 401s.
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && (needs.changes.outputs.dbt == 'true' || needs.changes.outputs.full == 'true') && github.actor != 'dependabot[bot]' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref == 'refs/heads/staging/official' && 'staging/official' || github.sha }}

      - name: Authenticate Google Service Account
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: 'true'
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Setup GCloud utilities
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          working-directory: warehouse
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-python: true

      - name: Cache venv and dbt packages
        uses: actions/cache@v4
        with:
          path: |
            warehouse/.venv
            warehouse/dbt_packages
          key: dbt-setup-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('warehouse/uv.lock', 'warehouse/packages.yml') }}

      - name: Install the project
        working-directory: warehouse
        run: uv sync --locked --all-extras --dev

      - name: Install dbt dependencies
        working-directory: warehouse
        run: uv run dbt deps

      - name: Print dbt environment
        working-directory: warehouse
        run: uv run dbt debug --target ${{ env.DBT_TARGET }}

      - name: Compile dbt
        working-directory: warehouse
        run: uv run dbt compile --target ${{ env.DBT_TARGET }}

      - name: Print dbt environment
        working-directory: warehouse
        run: uv run dbt debug --target ${{ env.DBT_TARGET }}

      - name: Discover Payments Metabase databases
        id: payments-databases
        run: |
          set -euo pipefail

          # Each agency has its own Metabase database connection named
          # "Payments - <Agency Name>" (per the create-metabase-dashboards
          # runbook). Column-level docs from dbt have to land on every one
          # of those connections, not just the central warehouse connection,
          # so this step enumerates them via the Metabase API.
          #
          # We also capture each connection's dataset filter
          # (dataset-filters-type + dataset-filters-patterns) so the sync
          # step can scope dbt-metabase to exactly the schemas Metabase
          # exposes on that connection. Per-agency configs differ — e.g.
          # some have mart_benefits in their inclusion list, others don't —
          # and dbt-metabase fails the whole sync whenever a requested
          # schema isn't visible on the connection.
          # --retry/--retry-all-errors absorb transient 5xx blips from
          # Metabase (e.g., container restart, brief deploy event) so a
          # one-off Service Unavailable doesn't fail the whole workflow.
          PAYMENTS_DBS_JSON=$(curl -fsS \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -H "x-api-key: ${METABASE_API_KEY}" \
            "${METABASE_URL}/api/database" \
            | jq -c '[.data[] | select(.name | startswith("Payments - ")) | {
                name: .name,
                filter_type: .details["dataset-filters-type"],
                filter_patterns: .details["dataset-filters-patterns"]
              }]')

          if [ "$(echo "${PAYMENTS_DBS_JSON}" | jq 'length')" = "0" ]; then
            echo "No 'Payments - *' databases found. Will sync only the central database."
          else
            echo "Discovered Payments databases:"
            echo "${PAYMENTS_DBS_JSON}" \
              | jq -r '.[] | "  - \(.name) [filter_type=\(.filter_type // "<null>") patterns=\(.filter_patterns // "<null>")]"'
          fi

          {
            echo "json<<EOF"
            echo "${PAYMENTS_DBS_JSON}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Synchronize Metabase
        working-directory: warehouse
        env:
          PAYMENTS_DBS_JSON: ${{ steps.payments-databases.outputs.json }}
        run: |
          set -euo pipefail

          sync_metabase_metadata() {
            local db="$1"
            shift
            echo "::group::dbt-metabase sync — ${db}"
            uv run dbt-metabase models -v \
              --manifest-path=target/manifest.json \
              --skip-sources \
              --docs-url="${DBT_DOCS_URL}" \
              --metabase-url="${METABASE_URL}" \
              --metabase-database="${db}" \
              --metabase-api-key="${METABASE_API_KEY}" \
              "$@"
            echo "::endgroup::"
          }

          failed=0

          # Central warehouse connection — broad sync, exclude internal schemas.
          if ! sync_metabase_metadata "${METABASE_DESTINATION_DATABASE}" \
               --exclude-schemas=staging,payments; then
            failed=1
            echo "::warning::dbt-metabase sync failed for '${METABASE_DESTINATION_DATABASE}'"
          fi

          # Per-agency Payments connections — scope dbt-metabase to the
          # exact schemas each connection exposes via its dataset filter,
          # read from the Metabase API. Keeps the sync correct as agency
          # configs evolve (new schemas added, mart_benefits enabled or
          # disabled per agency, etc.) without code changes. Loop is
          # partial-tolerant so one agency's outage doesn't block the rest.
          if [ -n "${PAYMENTS_DBS_JSON}" ] && [ "${PAYMENTS_DBS_JSON}" != "[]" ]; then
            while IFS=$'\t' read -r db filter_type patterns; do
              [ -z "${db}" ] && continue
              case "${filter_type}" in
                inclusion)
                  args=(--include-schemas="${patterns}")
                  ;;
                exclusion)
                  args=(--exclude-schemas="${patterns}")
                  ;;
                *)
                  # No dataset filter on the connection — fall back to the
                  # central-DB exclusion set. Unlikely for per-agency
                  # connections but handled defensively.
                  args=(--exclude-schemas=staging,payments)
                  ;;
              esac
              if ! sync_metabase_metadata "${db}" "${args[@]}"; then
                failed=1
                echo "::warning::dbt-metabase sync failed for '${db}'"
              fi
            done < <(echo "${PAYMENTS_DBS_JSON}" \
              | jq -r '.[] | [.name, (.filter_type // ""), (.filter_patterns // "")] | @tsv')
          fi

          if [ "${failed}" -ne 0 ]; then
            echo "::error::One or more dbt-metabase syncs failed"
            exit 1
          fi

  plan-changes-airflow-staging:
    name: Staging Plan for Airflow Changes
    runs-on: ubuntu-latest
    needs: [changes]

    # If there are changes to staging airflow iac files `terraform-plan` workflow will take care.
    # PRs into main preview staging/official + this PR, which the sync deploys after merging.
    if: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'staging/official') && needs.changes.outputs.staging-airflow-tf != 'true' }}

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preview staging/official with this PR
        id: preview
        if: ${{ github.base_ref == 'main' }}
        uses: ./.github/actions/staging-preview-checkout
        with:
          head: ${{ github.event.pull_request.head.sha }}

      - uses: google-github-actions/auth@v2
        if: ${{ steps.preview.outputs.ok != 'false' }}
        with:
          create_credentials_file: 'true'
          project_id: cal-itp-data-infra-staging
          workload_identity_provider: 'projects/473674835135/locations/global/workloadIdentityPools/github-actions/providers/data-infra'
          service_account: 'github-actions-terraform@cal-itp-data-infra-staging.iam.gserviceaccount.com'

      - name: Terraform Plan
        if: ${{ steps.preview.outputs.ok != 'false' }}
        uses: dflook/terraform-plan@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          add_github_comment: changes-only
          path: iac/cal-itp-data-infra-staging/airflow/us

  plan-changes-airflow-production:
    name: Production Plan for Airflow Changes
    runs-on: ubuntu-latest
    needs: [changes]

    # If there are changes to production airflow iac files `terraform-plan` workflow will take care
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && needs.changes.outputs.production-airflow-tf != 'true' }}

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v2
        with:
          create_credentials_file: 'true'
          project_id: cal-itp-data-infra
          workload_identity_provider: 'projects/1005246706141/locations/global/workloadIdentityPools/github-actions/providers/data-infra'
          service_account: 'github-actions-terraform@cal-itp-data-infra.iam.gserviceaccount.com'

      - name: Terraform Plan
        uses: dflook/terraform-plan@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          add_github_comment: changes-only
          path: iac/cal-itp-data-infra/airflow/us

  apply-changes-airflow-staging:
    name: Staging Apply Airflow Changes
    runs-on: ubuntu-latest
    # After compile: the module uploads the manifest compile put in the docs bucket.
    needs: [changes, compile]

    # If there are changes to staging airflow iac files `terraform-apply` workflow will take care
    if: ${{ github.ref == 'refs/heads/staging/official' && (needs.changes.outputs.dbt == 'true' || needs.changes.outputs.full == 'true') && needs.changes.outputs.staging-airflow-tf != 'true' }}

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: terraform-iac/cal-itp-data-infra-staging/airflow/us
      cancel-in-progress: false

    steps:
      # On staging/official, use the branch tip: runs finish out of order, and
      # an older commit must never roll back a newer one.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref == 'refs/heads/staging/official' && 'staging/official' || github.sha }}
          fetch-depth: 0

      - name: Require main in staging/official
        run: python3 .github/scripts/staging_official.py require-main

      - uses: google-github-actions/auth@v2
        with:
          create_credentials_file: 'true'
          project_id: cal-itp-data-infra-staging
          workload_identity_provider: 'projects/473674835135/locations/global/workloadIdentityPools/github-actions/providers/data-infra'
          service_account: 'github-actions-terraform@cal-itp-data-infra-staging.iam.gserviceaccount.com'

      - name: Terraform Apply
        uses: dflook/terraform-apply@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: iac/cal-itp-data-infra-staging/airflow/us
          # use auto_approve: 'true' only here to make sure model changes are applied even if the plan was different
          auto_approve: 'true'

  apply-changes-airflow-production:
    name: Production Apply Airflow Changes
    runs-on: ubuntu-latest
    needs: [changes, compile]

    # If there are changes to production airflow iac files `terraform-apply` workflow will take care
    if: ${{ github.ref == 'refs/heads/main' && needs.changes.outputs.dbt == 'true' && needs.changes.outputs.production-airflow-tf != 'true' }}

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: terraform-iac/cal-itp-data-infra/airflow/us
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v2
        with:
          create_credentials_file: 'true'
          project_id: cal-itp-data-infra
          workload_identity_provider: 'projects/1005246706141/locations/global/workloadIdentityPools/github-actions/providers/data-infra'
          service_account: 'github-actions-terraform@cal-itp-data-infra.iam.gserviceaccount.com'

      - name: Terraform Apply
        uses: dflook/terraform-apply@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: iac/cal-itp-data-infra/airflow/us
          # use auto_approve: 'true' only here to make sure model changes are applied even if the plan was different
          auto_approve: 'true'

  # Metabase isn't required: a failed metadata sync shouldn't make the next
  # deploy re-run every model since this one.
  record:
    name: Record staging deploy
    needs: [changes, compile, dbt-run, apply-changes-airflow-staging]
    if: ${{ github.ref == 'refs/heads/staging/official' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Record deploy
        uses: ./.github/actions/record-deploy
        with:
          ref: refs/deployed/staging/deploy-dbt
