name: Staging monitor

# Every 30 minutes:
# - syncs staging/official if it has been missing main commits for 30+ minutes,
#   and opens/updates/closes the incident issue
# - nudges, warns and (with STAGING_AUTO_REMOVE=on) removes expired tests
# - resets staging/official to main once nothing in it differs from main
# - rewrites the pinned status issue
# - re-evaluates staging/guards and staging/gate on every open PR
# See docs/architecture/staging-deployment.md.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    name: Monitor
    runs-on: ubuntu-latest

    # May push (sync, removals, reset), so it queues behind other writers.
    concurrency:
      group: staging-official-writer
      cancel-in-progress: false

    steps:
      - name: Create App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.STAGING_BOT_APP_ID }}
          private-key: ${{ secrets.STAGING_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Monitor
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.app.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com
          STAGING_STEWARD: ${{ vars.STAGING_STEWARD }}
          STAGING_TEAM: ${{ vars.STAGING_TEAM }}
          STAGING_AUTO_REMOVE: ${{ vars.STAGING_AUTO_REMOVE }}
        run: python3 .github/scripts/staging_official.py monitor

  # Statuses are set with GITHUB_TOKEN everywhere, so the rulesets can require
  # them from GitHub Actions.
  checks:
    name: Re-evaluate checks
    runs-on: ubuntu-latest
    needs: [monitor]
    if: ${{ !cancelled() }}

    permissions:
      contents: read
      statuses: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: staging/guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/staging_official.py guards

      - name: staging/gate
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/staging_official.py gate
